# 3D models through Tripo Studio with the member account logged in on the machine (no API key). The MCP server is the MIT package
# tripo-studio-plugin; this plugin starts it, gives workers its tools, and gives Alba one paid operation that goes through it end to end.
# Enable it with   plugins: { enable: [tripo-3d], settings: { tripo-3d: { server: <path>/mcp/bootstrap.mjs, ceiling: 60 } } }
id: tripo-3d
version: 1.1.0
apiVersion: 1
kinds: [tool]
description: Generates and edits 3D models with Tripo Studio (the member account logged in on this machine) - generate, segment and complete parts, remesh, texture, rig, animate, motions, Smart UV - and downloads them.

settings:
  server:
    description: Absolute path of a local Tripo Studio plugin's mcp/bootstrap.mjs (for example in the Codex plugin cache); empty to start the npm package with npx.
    default: ""
  package:
    description: The npm package of the Tripo Studio MCP server, used when server is empty.
    default: tripo-studio-plugin@0.3.13
  ceiling:
    description: Credits a quote asks for when Tripo cannot price an operation (its quote says unknown). A person approves it; what the wallet shows was spent is booked.
    default: "60"

agent:
  mcp:
    tripo:
      command: node
      args: ["${plugin}/start-tripo.mjs", --server, "${setting.server}", --package, "${setting.package}"]
      tools: [tripo_auth_status, tripo_get_payment, tripo_list_models, tripo_get_model, tripo_list_operations, tripo_quote_operation,
              tripo_generate_model, tripo_generate_texture, tripo_generate_pbr, tripo_export_model, tripo_download,
              tripo_get_configuration_review, tripo_task_sync, tripo_task_wait, tripo_task_cancel, tripo_get_task, tripo_list_tasks,
              tripo_task_reconcile, tripo_render_model,
              tripo_import_model, tripo_segment_model, tripo_complete_parts, tripo_remesh_model, tripo_upscale_texture,
              tripo_rig_model, tripo_animate_model, tripo_list_animation_presets, tripo_generate_motion, tripo_apply_motion,
              tripo_list_motions, tripo_get_motion, tripo_generate_uv, tripo_apply_uv, tripo_get_uv_context,
              tripo_preview_texture_edit, tripo_apply_texture_edits, tripo_inspect_local_parts, tripo_edit_parts,
              tripo_bake_texture_projection, tripo_paint_texture, tripo_crop_image, tripo_list_image_assets, tripo_get_image_asset,
              tripo_generate_multiview]
    tripo-ops:
      command: node
      args: ["${plugin}/ops.mjs", --server, "${setting.server}", --package, "${setting.package}", --ceiling, "${setting.ceiling}"]
      workers: false
  skill: skills/tripo-3d

machines:
  probe: [node, "${plugin}/start-tripo.mjs", --check, --server, "${setting.server}", --package, "${setting.package}"]

resources:
  tripo-wallet: { slots: 1 }   # one paid Tripo call at a time: the spend is read from the wallet before and after

operations:
  generate-model:
    description: A model from a picture, from views of one object, or from text; waited for and downloaded (GLB, or exported to another format). Paid in Tripo credits.
    input:
      type: object
      required: [mode, face_limit]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [image, multiview, text] }
        image_path: { type: string, description: "mode image: absolute path of the picture" }
        front_image_path: { type: string }
        back_image_path: { type: string }
        left_image_path: { type: string }
        right_image_path: { type: string }
        prompt: { type: string, maxLength: 1000, description: "mode text" }
        tier: { type: string, enum: [smart_mesh, high_detail], description: "default smart_mesh (an untextured mesh)" }
        face_limit: { type: integer, minimum: 1 }
        texture: { type: boolean, description: "high_detail only" }
        pbr: { type: boolean, description: "high_detail only" }
        texture_quality: { type: string, enum: [standard, detailed, ultra] }
        format: { type: string, enum: [glb, fbx, obj, usdz, stl, 3mf] }
        name: { type: string, description: "file name without extension (default: model)" }
        character_name: { type: string }
        model_version: { type: string }
        quad: { type: boolean }
        smart_poly: { type: boolean }
        generate_parts: { type: boolean, description: "split into parts while generating (needed for later part work)" }
        t_pose: { type: boolean }
        geometry_quality: { type: string }
        symmetry: { type: string }
        delight: { type: boolean }
        texture_alignment: { type: string }
        enable_image_autofix: { type: boolean }
        segmentation_granularity: { type: string }
    run: { mcp: tripo-ops, tool: tripo_make_model, out_arg: out_dir }
    quote: { unit: credits, tool: tripo_price }
    output: { files: ["*.glb", "*.fbx", "*.obj", "*.usdz", "*.stl", "*.3mf", "*.zip"] }
    timeout_minutes: 90
  operate:
    description: >-
      Any other paid Studio operation on an existing project or asset - segment_model, complete_parts, remesh_model, generate_texture,
      generate_pbr, upscale_texture, rig_model, animate_model, generate_motion, apply_motion, generate_uv, generate_multiview,
      preview_texture_edit, apply_texture_edits. args are that Tripo tool's own arguments (project_id from an earlier job's
      result.json). Waited for; the resulting model is downloaded when there is one. Paid in Tripo credits.
    input:
      type: object
      required: [tool, args]
      additionalProperties: false
      properties:
        tool: { type: string, enum: [generate_multiview, segment_model, complete_parts, remesh_model, generate_texture, generate_pbr, upscale_texture, rig_model, animate_model, generate_motion, apply_motion, generate_uv, preview_texture_edit, apply_texture_edits] }
        args: { type: object }
        download: { type: boolean }
        format: { type: string, enum: [glb, fbx, obj, usdz, stl, 3mf] }
        name: { type: string }
    run: { mcp: tripo-ops, tool: tripo_operate, out_arg: out_dir }
    quote: { unit: credits, tool: tripo_price_op }
    output: { files: ["*.glb", "*.fbx", "*.obj", "*.usdz", "*.stl", "*.3mf", "*.zip", "result.json"] }
    timeout_minutes: 90
  operate-free:
    description: A free Studio operation - import_model (a local GLB/FBX/OBJ becomes a Studio project), export_model, apply_uv. Waited for; a model result is downloaded.
    input:
      type: object
      required: [tool, args]
      additionalProperties: false
      properties:
        tool: { type: string, enum: [import_model, export_model, apply_uv] }
        args: { type: object }
        download: { type: boolean }
        format: { type: string, enum: [glb, fbx, obj, usdz, stl, 3mf] }
        name: { type: string }
    run: { mcp: tripo-ops, tool: tripo_operate_free, out_arg: out_dir }
    output: { files: ["*.glb", "*.fbx", "*.obj", "*.usdz", "*.stl", "*.3mf", "*.zip", "result.json"] }
    timeout_minutes: 60
  read:
    description: A read-only or local Studio tool - get_model (include parts / animation_presets), list_models, get_task, list_tasks, list_animation_presets, list_motions, get_motion, get_uv_context, inspect_local_parts, render_model, edit_parts, bake_texture_projection, paint_texture, crop_image, get_payment, list_operations. Its answer is kept as result.json.
    input:
      type: object
      required: [tool, args]
      additionalProperties: false
      properties:
        tool: { type: string, enum: [get_model, list_models, get_task, list_tasks, list_animation_presets, list_motions, get_motion, get_uv_context, inspect_local_parts, render_model, edit_parts, bake_texture_projection, paint_texture, crop_image, get_payment, list_operations] }
        args: { type: object }
    run: { mcp: tripo-ops, tool: tripo_read, out_arg: out_dir }
    output: { files: ["result.json", "*.webp", "*.png", "*.glb"] }
    timeout_minutes: 20
