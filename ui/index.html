<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2314183A'/%3E%3Cpath d='M14.5 50 L32 13.5 L49.5 50' fill='none' stroke='%23FAF3E6' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M21 45a11 11 0 0 1 22 0z' fill='%23F5A524'/%3E%3Crect x='18' y='44.5' width='28' height='4' rx='2' fill='%23F0785A'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#14183A" />
    <title>Alba</title>
    <script>
      // Apply the stored theme before the first paint (no flash).
      try {
        var th = localStorage.getItem('alba-theme');
        if (th === 'dark' || (th !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        var mo = localStorage.getItem('alba-motion');
        if (mo === 'full' || mo === 'reduced') document.documentElement.setAttribute('data-motion', mo);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
